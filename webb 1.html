<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Building Energy Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header p {
            margin-top: 0.5rem;
            font-weight: 300;
            opacity: 0.9;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .building-img {
            width: 100%;
            height: 250px;
            background: #ddd url('https://cdn.phototourl.com/free/2026-04-28-1313d3ed-d454-41e7-93a6-95ff5c9c9d05.webp') center/cover;
            /* คุณสามารถเปลี่ยน URL รูปภาพตึกจริงของคุณได้ที่นี่ */
        }

        .content {
            padding: 2rem;
        }

        .content h2 {
            color: #1a2a6c;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        .content p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* Button */
        .btn-dashboard {
            display: inline-block;
            background: #b21f1f;
            color: white;
            text-decoration: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(178, 31, 31, 0.3);
        }

        .btn-dashboard:hover {
            background: #1a2a6c;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(26, 42, 108, 0.4);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
            color: #888;
        }

        /* Responsive */
        @media (max-width: 480px) {
            header h1 { font-size: 1.8rem; }
            .container { width: 95%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Smart Energy Monitoring</h1>
        <p>มหาวิทยาลัยเกษตรศาสตร์ | ระบบจัดการพลังงานอัจฉริยะ</p>
    </header>

    <main>
        <div class="container">
            <div class="building-img"></div>
            
            <div class="content">
                <h2>Building 14</h2>
                <p>ระบบติดตามการใช้ไฟฟ้าแบบ Real-time ของอาคาร 14 <br> ตรวจสอบค่า Voltage, Current, Watt และ Energy</p>
                
                <a href="https://kritsophon.github.io/Energydashboard/" 
                   target="_blank" 
                   class="btn-dashboard">
                     Dashboard Building 14
                </a>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Smart Energy Monitoring For Faculty Of Engineer Project 
    </footer>

</body>
</html>
