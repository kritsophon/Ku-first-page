<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU ENERGY MONITORING</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header ตามแบบร่าง */
        header {
            background: linear-gradient(135deg, #1a2a6c, #1d8552);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        /* ส่วนแสดง 3D Model แทนที่รูปภาพเดิม */
        model-viewer {
            width: 100%;
            height: 400px; /* ปรับความสูงตามต้องการ */
            background-color: #fafbfc;
            --poster-color: transparent;
        }

        .content {
            padding: 2rem;
        }

        .content h2 {
            color: #1a2a6c;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .content p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* ปุ่มกดไปหน้า Dashboard ตามแบบร่าง */
        .btn-dashboard {
            display: inline-block;
            background: #1a2a6c;
            color: white;
            text-decoration: none;
            padding: 1rem 3rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(26, 42, 108, 0.2);
        }

        .btn-dashboard:hover {
            background: #152258;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(26, 42, 108, 0.3);
        }

        /* ลิงก์ Google Sheet ด้านล่างตามแบบร่าง */
        .sheet-link-section {
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .btn-sheet {
            color: #1d8552;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid #1d8552;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>KU ENERGY MONITORING</h1>
        <p>มหาวิทยาลัยเกษตรศาสตร์ | ระบบจัดการพลังงานอัจฉริยะ</p>
    </header>

    <main>
        <div class="container">
            <model-viewer 
                src="building models.glb" 
                alt="3D Building Model" 
                auto-rotate 
                camera-controls 
                shadow-intensity="1" 
                touch-action="pan-y">
            </model-viewer>
            
            <div class="content">
                <h2>Building 14</h2>
                <p>คลิกปุ่มด้านล่างเพื่อเข้าสู่ระบบติดตามการใช้ไฟฟ้าแบบ Real-time</p>
                
                <a href="https://kritsophon.github.io/Energydashboard/" class="btn-dashboard">
                    เข้าสู่ Dashboard Building 14 →
                </a>

                <div class="sheet-link-section">
                    
                        
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Smart Energy Monitoring Project | Faculty of Engineering
    </footer>

</body>
</html>
